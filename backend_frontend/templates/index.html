<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepthGen | 2D to 3D Converter</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border_box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            font-weight: 300;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            height: 70vh;
        }

        .controls {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            backdrop-filter: blur(20px);
        }

        .viewer {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* Input Styling */
        .file-upload {
            position: relative;
            width: 100%;
            height: 150px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .file-upload input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        /* Range Sliders */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Button */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <h1>DepthGen</h1>
        <p class="subtitle">Convert 2D Images to 3D Point Clouds instantly</p>
    </header>

    <main>
        <div class="container">
            <div class="controls">
                <div class="file-upload">
                    <div class="icon">📁</div>
                    <span id="file-label">Drop image or click to upload</span>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <div class="slider-group">
                    <label>Depth Intensity</label>
                    <input type="range" id="depthParams" min="10" max="200" value="50">
                </div>
                
                <div class="slider-group">
                    <label>Resolution (Performance)</label>
                    <input type="range" id="resParams" min="10" max="100" value="50">
                </div>

                <button class="btn" id="convertBtn">
                    <span class="btn-text">Generate 3D Model</span>
                    <div class="loader"></div>
                </button>
            </div>

            <div class="viewer">
                <div id="canvas-container"></div>
            </div>
        </div>
    </main>

    <!-- App Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        let scene, camera, renderer, controls, pointCloud;

        // Init Scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            // scene.background = new THREE.Color(0x0f172a); // Match bg-dark if mapped
            
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, -100, 100);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Ambient light
            const light = new THREE.AmbientLight(0xffffff, 1);
            scene.add(light);

            // Grid helper
            const gridHelper = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();

        // UI Logic
        const imageInput = document.getElementById('imageInput');
        const convertBtn = document.getElementById('convertBtn');
        const fileLabel = document.getElementById('file-label');

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileLabel.innerText = e.target.files[0].name;
            }
        });

        convertBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('Please select an image first');
                return;
            }

            // UI State = Loading
            convertBtn.disabled = true;
            document.querySelector('.btn-text').style.display = 'none';
            document.querySelector('.loader').style.display = 'block';

            const formData = new FormData();
            formData.append('image', file);
            formData.append('z_intensity', document.getElementById('depthParams').value);
            formData.append('scale', document.getElementById('resParams').value / 100);

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadPLY(data.ply_url);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error(error);
                alert('Failed to process image');
            } finally {
                // UI State = Reset
                convertBtn.disabled = false;
                document.querySelector('.btn-text').style.display = 'block';
                document.querySelector('.loader').style.display = 'none';
            }
        });

        function loadPLY(url) {
            // Remove old point cloud
            if (pointCloud) scene.remove(pointCloud);

            const loader = new PLYLoader();
            loader.load(url, (geometry) => {
                geometry.computeVertexNormals();

                // Material for points
                const material = new THREE.PointsMaterial({ 
                    size: 1, 
                    vertexColors: true 
                });

                pointCloud = new THREE.Points(geometry, material);
                
                // Center geometry
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.center();

                scene.add(pointCloud);
                
                // Auto rotate to view better
                pointCloud.rotation.x =  - Math.PI; 
                
            });
        }

    </script>
</body>
</html>
