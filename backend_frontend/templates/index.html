<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerominds | Spatial 3D Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#050511', // Very dark blue/black
                        sidebar: '#080816', // Slightly lighter
                        primary: '#8b5cf6', // Violet
                        secondary: '#a855f7', // Purple
                        accent: '#6366f1', // Indigo
                        glass: 'rgba(255, 255, 255, 0.03)',
                        border: 'rgba(255, 255, 255, 0.05)',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050511;
            /* Matches tailwind config */
            color: #fff;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .custom-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="h-screen w-screen flex overflow-hidden text-gray-300">

    <!-- Sidebar -->
    <aside class="w-[380px] flex flex-col bg-sidebar border-r border-border p-8 shrink-0 relative z-10">
        <!-- Header -->
        <div class="mb-10">
            <h1
                class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-purple-600 mb-1">
                Aerominds</h1>
            <div class="text-[0.65rem] tracking-[0.2em] font-medium text-gray-500 uppercase">Spatial 3D Engine</div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 flex flex-col gap-8 overflow-y-auto pr-2 custom-scrollbar">

            <!-- Input Source -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-4">Input Source</label>
                <div class="relative group">
                    <input type="file" id="imageInput" accept="image/*"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" />
                    <div id="dropZone"
                        class="h-48 rounded-2xl border border-dashed border-gray-700 bg-[rgba(255,255,255,0.01)] group-hover:bg-[rgba(255,255,255,0.03)] group-hover:border-violet-500/50 transition-all duration-300 flex flex-col items-center justify-center p-4">
                        <div class="w-12 h-12 mb-3 rounded-full bg-yellow-500/10 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-yellow-500" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                                </path>
                            </svg>
                        </div>
                        <p id="file-label" class="text-sm text-gray-400 font-medium truncate max-w-full px-2">Select
                            Image File</p>
                        <p class="text-xs text-gray-600 mt-1">PNG, JPG supported</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-8">
                <!-- Z-Axis Extrusion -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-white">Z-Axis Extrusion</label>
                        <span
                            class="text-xs px-2 py-1 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Depth</span>
                    </div>

                    <div class="relative h-12 flex items-center">
                        <span
                            class="absolute left-0 text-[10px] uppercase tracking-wider text-gray-600 font-bold">Flat</span>
                        <input type="range" id="depthParams" min="10" max="200" value="50"
                            class="custom-slider w-full h-1 bg-gray-800 rounded-lg appearance-none mx-8 focus:outline-none">
                        <span
                            class="absolute right-0 text-[10px] uppercase tracking-wider text-gray-600 font-bold">Deep</span>
                    </div>
                </div>

                <!-- Voxel Density -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-white">Voxel Density</label>
                        <span
                            class="text-xs px-2 py-1 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20">Quality</span>
                    </div>

                    <div class="relative h-12 flex items-center">
                        <span
                            class="absolute left-0 text-[10px] uppercase tracking-wider text-gray-600 font-bold">Perf.</span>
                        <input type="range" id="resParams" min="10" max="100" value="50"
                            class="custom-slider w-full h-1 bg-gray-800 rounded-lg appearance-none mx-8 focus:outline-none">
                        <span
                            class="absolute right-0 text-[10px] uppercase tracking-wider text-gray-600 font-bold">Detail</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Action Button -->
        <div class="pt-6 mt-auto">
            <button id="convertBtn"
                class="group relative w-full h-14 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-medium shadow-lg shadow-violet-900/20 hover:shadow-violet-900/40 hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center overflow-hidden">
                <div
                    class="absolute inset-0 bg-white/20 group-hover:translate-x-full transition-transform duration-700 ease-in-out -translate-x-full skew-x-12">
                </div>
                <span class="btn-text flex items-center gap-2">
                    Generate 3D Model
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="w-4 h-4 transition-transform group-hover:translate-x-1" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
                <div class="loader hidden"></div>
            </button>
            <div class="mt-4 text-center">
                <p class="text-[10px] font-mono text-gray-700 tracking-wider">AEROMINDS RENDER ENGINE V1.0</p>
            </div>
        </div>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 relative bg-black grid-bg overflow-hidden flex flex-col">
        <!-- Top Overlay -->
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-10 pointer-events-none">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)] animate-pulse">
                </div>
                <span class="text-[10px] font-mono text-gray-400 tracking-widest uppercase">Viewport Ready</span>
            </div>

            <div class="flex gap-2">
                <div
                    class="bg-gray-900/80 backdrop-blur border border-gray-800 rounded px-3 py-1.5 flex items-center gap-2">
                    <span class="text-[10px] font-mono text-gray-400">Left Click: Rotate</span>
                </div>
                <div
                    class="bg-gray-900/80 backdrop-blur border border-gray-800 rounded px-3 py-1.5 flex items-center gap-2">
                    <span class="text-[10px] font-mono text-gray-400">Right Click: Pan</span>
                </div>
            </div>
        </div>

        <!-- 3D Canvas -->
        <div id="canvas-container" class="w-full h-full cursor-move"></div>

    </main>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        let scene, camera, renderer, controls, pointCloud;

        // Init Scene
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            // Transparent background to show grid

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(20, 50, 100);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Tone mapping for better look
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            // subtle glow point lights
            const purpleLight = new THREE.PointLight(0xa855f7, 2, 100);
            purpleLight.position.set(-20, 20, 20);
            scene.add(purpleLight);

            const blueLight = new THREE.PointLight(0x6366f1, 2, 100);
            blueLight.position.set(20, -20, 20);
            scene.add(blueLight);


            // Base Grid
            const gridHelper = new THREE.GridHelper(200, 40, 0x333333, 0x111111);
            gridHelper.position.y = -20;
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            // Subtle rotation if cloud exists
            if (pointCloud) {
                // pointCloud.rotation.y += 0.0005; 
            }
            renderer.render(scene, camera);
        }

        init();

        // UI Interactions
        const imageInput = document.getElementById('imageInput');
        const convertBtn = document.getElementById('convertBtn');
        const fileLabel = document.getElementById('file-label');
        const dropZone = document.getElementById('dropZone');

        // Drag and Drop Effects
        imageInput.addEventListener('dragenter', () => {
            dropZone.classList.add('border-violet-500', 'bg-violet-500/10');
        });
        imageInput.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-violet-500', 'bg-violet-500/10');
        });
        imageInput.addEventListener('drop', () => {
            dropZone.classList.remove('border-violet-500', 'bg-violet-500/10');
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const name = e.target.files[0].name;
                fileLabel.innerText = name;
                fileLabel.classList.add('text-white');
            }
        });

        convertBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                // Need a toast or alert here, simple alert for now
                alert('Please select an image first');
                return;
            }

            // Loading State
            convertBtn.disabled = true;
            convertBtn.querySelector('.btn-text').classList.add('hidden');
            convertBtn.querySelector('.loader').classList.remove('hidden');
            convertBtn.classList.add('opacity-70', 'cursor-not-allowed');

            const formData = new FormData();
            formData.append('image', file);
            formData.append('z_intensity', document.getElementById('depthParams').value);
            formData.append('scale', document.getElementById('resParams').value / 100);

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    loadPLY(data.ply_url);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error(error);
                alert('Failed to process image');
            } finally {
                // Reset State
                convertBtn.disabled = false;
                convertBtn.querySelector('.btn-text').classList.remove('hidden');
                convertBtn.querySelector('.loader').classList.add('hidden');
                convertBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        function loadPLY(url) {
            if (pointCloud) scene.remove(pointCloud);

            const loader = new PLYLoader();
            loader.load(url, (geometry) => {
                geometry.computeVertexNormals();

                // Center Geometry
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.center();

                const material = new THREE.PointsMaterial({
                    size: 0.8, // Slightly smaller points for high res feel
                    vertexColors: true,
                    sizeAttenuation: true
                });

                pointCloud = new THREE.Points(geometry, material);
                pointCloud.rotation.x = -Math.PI; // Correct orientation often needed for images
                scene.add(pointCloud);

                // Animate camera to look at it
                // Tweening would be nice, but jump for now
                camera.position.set(0, 0, Math.max(geometry.boundingBox.max.x, geometry.boundingBox.max.y) * 2);
                controls.target.set(0, 0, 0);
            });
        }
    </script>
</body>

</html>
